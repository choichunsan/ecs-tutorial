      - ubuntu-latest
      # - codebuild-kfc-mapp-shd-runner-external-${{ github.run_id }}-${{ github.run_attempt }}
      # - buildspec-override:true
    
    outputs:
      # should-deploy: ${{ steps.check-deploy.outputs.should-deploy }}
      commit-sha: ${{ github.sha }}
      branch-name: ${{ github.ref_name }}
      target-env: ${{ steps.env-mapping.outputs.target-env }}
      codedeploy-app: ${{ steps.env-mapping.outputs.codedeploy-app }}
      codedeploy-group: ${{ steps.env-mapping.outputs.codedeploy-group }}
      deploy-role-arn: ${{ steps.env-mapping.outputs.deploy-role-arn }}
    
    steps:
      # - name: 📥 Checkout Code
      #   uses: actions/checkout@v4

      - name: 🎯 Environment Mapping
        id: env-mapping
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "현재 API URL: ${{ vars.ACCOUNT_ID }}"
          
          # 브랜치별 환경 매핑
          case $BRANCH in
            "dev")
              TARGET_ENV="dev"
              ACCOUNT_ID=${{ vars.ACCOUNT_ID }}
              ;;
            "qa"|"stg")
              TARGET_ENV="stg" 
              ACCOUNT_ID=${{ vars.ACCOUNT_ID }}
              ;;
            "main"|"prod")
              TARGET_ENV="prod"
              ACCOUNT_ID=${{ vars.ACCOUNT_ID }}
              ;;
            *)
              TARGET_ENV="dev"  # 기본값
              ACCOUNT_ID=${{ vars.ACCOUNT_ID }}
              ;;
          esac
          
          # 환경별 리소스 네이밍
          CODEDEPLOY_APP="kfc-mapp-${TARGET_ENV}-deploy-external"
          CODEDEPLOY_GROUP="kfc-mapp-${TARGET_ENV}-dg-external"
          DEPLOY_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/kfc-mapp-${TARGET_ENV}-role-cross-deploy"
          
          # GitHub Actions 출력 설정
          echo "target-env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "codedeploy-app=${CODEDEPLOY_APP}" >> $GITHUB_OUTPUT
          echo "codedeploy-group=${CODEDEPLOY_GROUP}" >> $GITHUB_OUTPUT
          echo "deploy-role-arn=${DEPLOY_ROLE_ARN}" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "  ENVIRONMENT MAPPING RESULT"
          echo "  Source Branch: ${BRANCH}"
          echo "  Target Environment: ${TARGET_ENV}"
          echo "  CodeDeploy App: ${CODEDEPLOY_APP}"
          echo "  CodeDeploy Group: ${CODEDEPLOY_GROUP}"
          echo "  Deploy Role: ${DEPLOY_ROLE_ARN}"
          echo "  ACCOUNT_ID: ${ACCOUNT_ID}"
          echo "=========================================="

      - name: ℹ️ Build Information
        run: |
          echo "=========================================="
          echo "  EXTERNAL CI/CD - BUILD STAGE"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Target Environment: ${{ steps.env-mapping.outputs.target-env }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Event: ${{ github.event_name }}"
