name: EXTERNAL - CI/CD

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: kfc-mapp-shd-artifact
  SERVICE_NAME: external

jobs:
